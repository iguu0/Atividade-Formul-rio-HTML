<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Formulário de Registo</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main class="container">
    <h1>Criar Conta</h1>
    <!-- O atributo novalidate desativa os balões de erro padrão do navegador -->
    <form id="form-cadastro" novalidate>
      
      <div class="campo">
        <label for="nome">Nome</label>
        <input type="text" id="nome" name="nome" placeholder="Mínimo de 3 letras">
        <span class="erro" id="erro-nome"></span>
      </div>

      <div class="campo">
        <label for="email">E-mail</label>
        <input type="email" id="email" name="email" placeholder="exemplo@dominio.com">
        <span class="erro" id="erro-email"></span>
      </div>

      <div class="campo">
        <label for="senha">Senha</label>
        <input type="password" id="senha" name="senha" placeholder="Mínimo de 8 caracteres">
        <span class="erro" id="erro-senha"></span>
      </div>

      <div class="campo">
        <label for="confirmacao">Confirmação de Senha</label>
        <input type="password" id="confirmacao" name="confirmacao" placeholder="Repita a senha">
        <span class="erro" id="erro-confirmacao"></span>
      </div>

      <button type="submit">Cadastrar</button>
    </form>
  </main>

  <script src="script.js"></script>
</body>
</html>
